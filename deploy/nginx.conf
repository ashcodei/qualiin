# Example Nginx config: reverse proxy in front of Gunicorn (multiple FastAPI workers).
# Upstream: Gunicorn bound to 127.0.0.1:8000 with 4 workers.
# Adjust server_name and paths as needed.

upstream plan_typo_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    location / {
        proxy_pass http://plan_typo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
